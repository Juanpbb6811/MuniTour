# ==============================================================
# MuniTour - Configuración principal de la aplicación
# ==============================================================

# Server
server.port=${PORT:8080}

# PostgreSQL - Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.cabrtyvyrxkergwiaybw}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:heZr1fBC1Us4Yjvk}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimizado para Supabase Session Pooler - límite 15)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:munitour-secret-key-cajica-sabana-centro-2026-very-long-secret}
jwt.expiration-ms=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Google Gemini AI - Event Ingestion
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
